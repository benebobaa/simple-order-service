name: Deploy

on:
  push:
    tags: ["v*"]

# Queue deploys instead of running them concurrently.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Kubeletto pulls public images and requires linux/amd64.
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      - name: Install kubeletto CLI
        run: |
          curl -fsSL https://kubeletto.com/install.sh | bash
          echo "$HOME/.kubeletto/bin" >> "$GITHUB_PATH"

      # KUBELETTO_TOKEN is a deploy-only API key stored as a repository secret.
      - name: Deploy to Kubeletto
        env:
          KUBELETTO_TOKEN: ${{ secrets.KUBELETTO_TOKEN }}
        run: |
          kubeletto deploy simple-order-service \
            --image "ghcr.io/${{ github.repository }}:${{ github.ref_name }}" \
            --wait --timeout 300 --non-interactive

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      # Functional gate: one pass over the public API of the deployed service.
      # A failed check fails the workflow so the release can be rolled back.
      - name: Post-deploy sanity checks
        env:
          BASE_URL: ${{ vars.SANITY_BASE_URL || 'https://simple-order-service.kubeletto.app' }}
        run: k6 run test/sanity/sanity.js

      # Parallel-request probe for race invariants (last item, cancel-once)
      # against the deployed environment: connection pool, replicas.
      - name: Post-deploy concurrency probe
        env:
          BASE_URL: ${{ vars.SANITY_BASE_URL || 'https://simple-order-service.kubeletto.app' }}
        run: k6 run test/sanity/concurrency.js

      - name: Rollback hint
        if: failure()
        run: |
          echo '### ⚠️ Deploy or sanity checks failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Roll back with: kubeletto rollback simple-order-service' >> "$GITHUB_STEP_SUMMARY"
